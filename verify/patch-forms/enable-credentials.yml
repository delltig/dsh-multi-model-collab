# dsh-base ships the file-backed credentials provider DISABLED; the web/desktop
# app layers re-enable it. A headless-template profile therefore has no
# credentials service at all, and every API-key lookup fails with
# MISSING_CREDENTIAL. This overlay re-enables the shipped row (id-targeted
# override, no insert), which is enough for the provider to authenticate from
# $DSH_HOME/.credentials.yaml.
- id: credentials
  disabled: false
